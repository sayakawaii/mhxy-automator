[metadata]
name = mhxy-automator
version = 0.1.0
description = An automated program for playing 梦幻西游 (Dream of the Red Chamber).
author = Your Name
author_email = your.email@example.com
url = https://github.com/yourusername/mhxy-automator
license = MIT

[options]
packages = find:
install_requires =
    opencv-python
    pyautogui
    pytesseract
    numpy
    requests

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    mhxy-automator = app:main